name: Sync pnpm lockfile

on:
  # Manual execution only. Automatic triggers are intentionally disabled.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
    # Keep the default branch protected from direct workflow commits.
    if: github.ref != 'refs/heads/principal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.12.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          #cache: pnpm

      # A full install creates pnpm-lock.yaml when it is missing and
      # synchronizes it when it already exists.
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      # Validate with the exact frozen mode used by CI before committing.
      - name: Validate frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit and push lockfile when changed or missing from Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            echo "Lockfile is already synchronized and passes frozen validation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- pnpm-lock.yaml
          git commit -m "chore: sync pnpm lockfile"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push
