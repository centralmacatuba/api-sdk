name: Sync OpenAPI types

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-generated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
    if: github.ref != 'refs/heads/principal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.12.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate OpenAPI types
        run: pnpm generate:types

      - name: Commit and push generated types when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- src/generated/schema.d.ts)" ]; then
            echo "Generated OpenAPI types are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- src/generated/schema.d.ts
          git commit -m "chore: sync generated OpenAPI types"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push || {
            git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" pull --rebase origin "$GITHUB_REF_NAME"

            # O branch pode ter recebido um OpenAPI mais recente durante a execução.
            # Regerar os tipos após o rebase evita publicar artefatos baseados no SHA antigo.
            pnpm generate:types
            if [ -n "$(git status --porcelain -- src/generated/schema.d.ts)" ]; then
              git add -- src/generated/schema.d.ts
              if [ "$(git log -1 --format=%s)" = "chore: sync generated OpenAPI types" ]; then
                git commit --amend --no-edit
              else
                git commit -m "chore: sync generated OpenAPI types"
              fi
            fi

            git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push
          }
