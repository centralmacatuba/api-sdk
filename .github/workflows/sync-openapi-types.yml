name: Sync OpenAPI types

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openapi-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.ref != 'refs/heads/principal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.12.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate OpenAPI types
        run: pnpm generate:types

      - name: Commit and push generated types when changed
        run: |
          if [ -z "$(git status --porcelain -- src/generated/schema.d.ts)" ]; then
            echo "Generated OpenAPI types are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- src/generated/schema.d.ts
          git commit -m "chore: sync generated OpenAPI types"
          git push
