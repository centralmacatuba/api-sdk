name: Release

on:
  push:
    branches:
      - principal

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-principal
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'centralmacatuba/api-sdk' && vars.NPM_RELEASE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.12.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify npm version for Trusted Publishing
        run: |
          node --version
          npm --version
          node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && (minor < 14 || (minor === 14 && patch < 0)))) process.exit(1)"
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 5) || ($1 == 11 && $2 == 5 && $3 < 1)) exit 1 }'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package contents
        run: pnpm pack --dry-run

      - name: Create version PR or publish release
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          commit: "chore: update package versions"
          title: "chore: update package versions"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Reconcile GitHub Packages against the exact npm version on every
      # successful run. This also makes a retry safe after a partial publish.
      - name: Publish or reconcile GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          NPM_REGISTRY="https://registry.npmjs.org/"
          GITHUB_REGISTRY="https://npm.pkg.github.com"

          if ! npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry="$NPM_REGISTRY" >/dev/null 2>&1; then
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} is not available on npm yet; skipping GitHub Packages."
            exit 0
          fi

          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN" --location=user

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry="$GITHUB_REGISTRY" >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on GitHub Packages."
            exit 0
          fi

          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.publishConfig={...p.publishConfig,registry:'https://npm.pkg.github.com'};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"
          npm publish --registry="$GITHUB_REGISTRY"
